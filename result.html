<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="speedometer">
            <div class="arc">
              <div class="segment seg1">
                <svg xmlns="http://www.w3.org/2000/svg" width="63" height="82" viewBox="0 0 63 82" fill="none">
                    <path d="M32.6589 0.561063C11.9613 22.5012 0.36731 51.4823 0.221369 81.6442L40.6781 81.84C40.7744 61.9324 48.4267 42.8042 62.0877 28.3232L32.6589 0.561063Z" fill="#E47741"/>
                </svg>
              </div>
              <div class="segment seg2">
                <svg xmlns="http://www.w3.org/2000/svg" width="88" height="66" viewBox="0 0 88 66" fill="none">
                    <path d="M86.9188 0.220469C70.7029 0.261576 54.6664 3.61648 39.794 10.0792C24.9215 16.5419 11.5268 25.9761 0.432174 37.8026L29.9381 65.4827C37.2609 57.6769 46.1017 51.4501 55.9179 47.1845C65.734 42.919 76.3184 40.7047 87.0213 40.6775L86.9188 0.220469Z" fill="#BD5330"/>
                  </svg>
              </div>
              <div class="segment seg3">
                <svg xmlns="http://www.w3.org/2000/svg" width="90" height="67" viewBox="0 0 90 67" fill="none">
                    <path d="M89.0219 38.8961C77.7705 26.5974 64.0608 16.7996 48.7811 10.1375C33.5013 3.47548 16.9924 0.0978249 0.323957 0.223422L0.628784 40.6795C11.6304 40.5966 22.5266 42.8259 32.6116 47.223C42.6966 51.6201 51.7453 58.0869 59.1715 66.2044L89.0219 38.8961Z" fill="#783B3A"/>
                  </svg>
              </div>
              <div class="segment seg4">
                <svg xmlns="http://www.w3.org/2000/svg" width="63" height="81" viewBox="0 0 63 81" fill="none">
                    <path d="M62.2193 80.796C62.1127 50.8838 50.7451 22.1089 30.3795 0.200094L0.747358 27.745C14.1891 42.2053 21.692 61.1974 21.7624 80.9402L62.2193 80.796Z" fill="#563A33"/>
                  </svg>
              </div>
            </div>
            <div class="needle-wrapper" id="needle">
                <div class="needle-line"></div>
                <div class="needle-base"></div>
            </div>
              
          </div>
    </main>
</body>
  
  <script>
    function calculateBMI(weight, height) {
      const heightInMeters = height / 100;
      return (weight / (heightInMeters * heightInMeters)).toFixed(1);
    }
  
    function showResult(bmi, category, suggestion) {
      // Remove calculating message
      const calcMessage = document.getElementById("calc-message");
      if (calcMessage) {
        calcMessage.remove();
      }
  
      const messageBox = document.createElement("div");
      messageBox.style.marginTop = "10px";
      messageBox.style.padding = "0 20px";
      messageBox.style.textAlign = "center";
  
      const [line1, line2] = suggestion.split('. ').map(s => s.trim());
  


   messageBox.innerHTML = `
    <div>
          <p class="bmi-result-value">
        Your BMI is ${bmi}
      </p>
      <p class="bmi-category-text">
        You have a 
        <span class="bmi-category">${category}</span>
      </p>
      <p class="bmi-description">${line1}.</p>
      <p class="bmi-description">${line2 || ""}</p>
    </div>
  

  <div class="button" style="margin-top: 40px;">
    <a href="index.html" class="btn">Calculate another</a>
  </div>
`;

  
      document.body.appendChild(messageBox);
    }
  
    function updateResult() {
      const gender = localStorage.getItem("gender");
      const height = parseFloat(localStorage.getItem("height"));
      const weight = parseFloat(localStorage.getItem("weight"));
  
      if (!height || !weight || !gender) {
        alert("Missing input data. Please go back and complete the form.");
        return;
      }
  
      const bmi = calculateBMI(weight, height);
      let finalRotation = 0;
      let category = "";
      let suggestion = "";
  
      if (bmi < 18.5) {
        finalRotation = -45;
        category = "Underweight.";
        suggestion = "It's important to eat a balanced diet. Maybe consult a nutritionist to gain weight healthily.";
      } else if (bmi >= 18.5 && bmi < 24.9) {
        finalRotation = -15;
        category = "Normal weight.";
        suggestion = "Great job! Maintain your healthy lifestyle. Keep up the good diet and exercise.";
      } else if (bmi >= 25 && bmi < 29.9) {
        finalRotation = 15;
        category = "Overweight.";
        suggestion = "Consider a more active lifestyle. A balanced diet can help improve your health.";
      } else {
        finalRotation = 45;
        category = "Obesity range.";
        suggestion = "Consult a healthcare provider. Get a personalized plan to improve your health.";
      }
  
    const calcMessage = document.createElement("p");
calcMessage.id = "calc-message";
calcMessage.className = "bmi-calculating-message";
calcMessage.textContent = "Calculating your BMI...";
document.body.appendChild(calcMessage);


      const needle = document.getElementById("needle");
      needle.style.transition = "transform 0.5s ease-in-out";
  
      const segmentAngles = [-45, -15, 15, 45];
      let elapsed = 0;
  
      const interval = setInterval(() => {
        const randomAngle = segmentAngles[Math.floor(Math.random() * segmentAngles.length)];
        needle.style.transform = `rotate(${randomAngle}deg)`;
        elapsed += 500;
  
        if (elapsed >= 5000) {
          clearInterval(interval);
  

          setTimeout(() => {
            needle.style.transform = `rotate(${finalRotation}deg)`;
          }, 500);
  

          setTimeout(() => {
            showResult(bmi, category, suggestion);
          }, 1000);
        }
      }, 500);
    }
  
    window.onload = updateResult;
  </script>
</html>
